name: CI

on:
  push:
    branches: [main, master, radical]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep the build backend and dev dependency in pyproject.toml in sync with this pin.
env:
  UV_VERSION: "0.13.8"
  MATURIN_VERSION: "1.16.0"
  RUST_TOOLCHAIN: "1.100.0"

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux ${{ matrix.platform.target }} / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - target: x86_64
            container: quay.io/pypa/manylinux2014_x86_64@sha256:e6a785657009c612fe2a85fa933051d03a50ba62b1c5e47d62abcab546a2e423
          - target: x86
            container: quay.io/pypa/manylinux2014_i686@sha256:7ff084c274da66ed891df826b97cd5bb1b1d36db2cc86e4f052ce47cb4b69ead
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Select container interpreter
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          abi="cp${PYTHON_VERSION//./}"
          echo "CONTAINER_PYTHON=/opt/python/$abi-$abi/bin/python" >> "$GITHUB_ENV"
      - name: Export locked test dependencies
        run: uv export --locked --extra dev --no-emit-project --prune maturin --output-file test-requirements.txt
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          container: ${{ matrix.platform.container }}
          manylinux: "2014"
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --out dist --interpreter ${{ env.CONTAINER_PYTHON }}
      - name: Install and test wheel in target architecture
        env:
          CONTAINER_IMAGE: ${{ matrix.platform.container }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/io:ro" -w /io \
            -e CONTAINER_PYTHON "$CONTAINER_IMAGE" bash -euo pipefail -c '
              "$CONTAINER_PYTHON" -m venv /tmp/wheel-test
              /tmp/wheel-test/bin/python -m pip install --require-hashes -r test-requirements.txt
              /tmp/wheel-test/bin/python -m pip install --no-deps --no-index --find-links dist rust-sasa-python
              /tmp/wheel-test/bin/python -m pytest tests/ -v -p no:cacheprovider
            '
      - name: Upload tested wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  native:
    name: ${{ matrix.platform.name }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - name: windows-x64
            runner: windows-2022
            target: x64
            python-arch: x64
          - name: windows-x86
            runner: windows-2022
            target: x86
            python-arch: x86
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            python-arch: x64
          - name: macos-aarch64
            runner: macos-15
            target: aarch64
            python-arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.python-arch }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --out dist --interpreter python
      - name: Install locked test dependencies and wheel
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          uv sync --locked --extra dev --no-install-project
          # UV_PYTHON selects the base interpreter; install into the project venv.
          uv pip install --python .venv --no-deps --no-index --find-links dist rust-sasa-python
      - name: Test installed wheel
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv run --no-sync pytest tests/ -v
      - name: Upload tested wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.name }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          command: sdist
          args: --out dist
      - name: Install and test sdist
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          MATURIN_PEP517_ARGS: "--locked"
        run: |
          uv sync --locked --extra dev --no-install-project
          uv pip install --python .venv --no-deps --no-build-isolation dist/*.tar.gz
          uv run --no-sync pytest tests/ -v
      - name: Upload tested sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Preserve the existing required status-check name while gating on artifact tests.
  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    needs: [linux, native, sdist]
    if: always()
    permissions: {}
    steps:
      - name: Require all distribution tests to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success'

  release:
    name: Release
    runs-on: ubuntu-24.04
    environment:
      name: publishing
    permissions:
      id-token: write
    needs: [linux, native, sdist, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: pypi-publishing
      cancel-in-progress: false
    steps:
      - name: Require protected release tag
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [ "$REF_PROTECTED" != true ]; then
            echo '::error::Protect v* tags with a repository ruleset before publishing. See .github/PUBLISHING.md.'
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Download tested distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
      - name: Publish
        run: uv publish --trusted-publishing always
